{% extends 'base.html' %}

{% block content %}
    <h1>Мой словарь</h1>

    <p>Нажмите на вопрос, чтобы открыть полный ответ.</p>
    {% for item in words %}
    <details style="padding:12px;border-bottom:1px solid #ddd;">
        <summary><strong>{{ item.word }}</strong> <small>— добавлено <time datetime="{{ item.date_added|date:'c' }}">{{ item.date_added|date:"d.m.Y" }}</time></small></summary>
        <p>{{ item.definition }}</p>
    </details>
    {% empty %}<p>В базе пока нет вопросов.</p>{% endfor %}
{% endblock %}
