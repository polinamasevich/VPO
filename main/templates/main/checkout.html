{% extends 'base.html' %}
{% block content %}<section><h1>Оплата и получение заказа</h1><p>Сумма товаров: <strong>{{ total }} BYN</strong>. Введите активный промокод, чтобы получить скидку.</p><form method="post">{% csrf_token %}{% for field in form %}<p id="field-{{ field.name }}"><label for="{{ field.id_for_label }}">{{ field.label }}</label><br>{{ field }}{% for error in field.errors %}<br><small style="color:#b00;">{{ error }}</small>{% endfor %}</p>{% endfor %}<button type="submit">Подтвердить оплату</button></form></section><script>const method=document.getElementById('id_fulfillment_method'),address=document.getElementById('field-address');function toggleAddress(){address.style.display=method.value==='delivery'?'block':'none';}method.addEventListener('change',toggleAddress);toggleAddress();</script>{% endblock %}
