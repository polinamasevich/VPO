<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="700" y="35" font-size="24" text-anchor="middle">Жизненный цикл Review (отзыва)</text><rect x="80" y="210" width="250" height="70" rx="12" fill="#eaf2ff" stroke="#355b8c"/><text x="205.0" y="251.0" font-size="17" text-anchor="middle">S0: ещё не создан</text><rect x="410" y="210" width="250" height="70" rx="12" fill="#eaf2ff" stroke="#355b8c"/><text x="535.0" y="251.0" font-size="17" text-anchor="middle">S1: опубликован</text><rect x="740" y="210" width="250" height="70" rx="12" fill="#eaf2ff" stroke="#355b8c"/><text x="865.0" y="251.0" font-size="17" text-anchor="middle">S2: отредактирован</text><rect x="1070" y="210" width="250" height="70" rx="12" fill="#eaf2ff" stroke="#355b8c"/><text x="1195.0" y="251.0" font-size="17" text-anchor="middle">S3: удалён</text><circle cx="30" cy="245" r="11" fill="#172b4d"/><path d="M41 245 H80" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 245 H410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="370" y="200" font-size="17" text-anchor="middle">T1</text><path d="M660 245 H740" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="200" font-size="17" text-anchor="middle">T3</text><path d="M990 245 H1070" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1030" y="200" font-size="17" text-anchor="middle">T6</text><path d="M1320 245 H1350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1370" cy="245" r="16" fill="white" stroke="#172b4d"/><circle cx="1370" cy="245" r="10" fill="#172b4d"/><path d="M535 280 V390 H1195 V280" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="415" font-size="17" text-anchor="middle">T6: автор или staff отправил POST удаления</text><path d="M140 210 V120 H270 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="95" font-size="15" text-anchor="middle">T2: данные неверны</text><path d="M470 210 V120 H600 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="75" font-size="15" text-anchor="middle">T4: данные неверны</text><text x="535" y="95" font-size="15" text-anchor="middle">T5: нет прав</text><path d="M800 210 V120 H930 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="75" font-size="15" text-anchor="middle">T3: повторное изменение</text><text x="865" y="95" font-size="15" text-anchor="middle">T4 / T5: отказ</text><text x="700" y="480" font-size="18" text-anchor="middle">T1: POST публикации [автор вошёл, рейтинг 1–5, текст ≥ 5 символов]</text><text x="700" y="515" font-size="18" text-anchor="middle">T3: POST изменения [автор или staff; данные валидны]</text><text x="700" y="550" font-size="16" text-anchor="middle">Состояния логические: S1 и S2 — одна запись с тем же ID; отдельного поля status нет.</text></g></svg>